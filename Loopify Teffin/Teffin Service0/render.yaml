services:
  - type: web
    name: dabbabox-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@dabbabox.in
      - key: ADMIN_PASSWORD
        value: dabbabox@2026
      - key: WHATSAPP_VERIFY_TOKEN
        value: dabbabox-verify-token-2026
      - key: DATA_DIR
        value: /data
      - key: ALLOWED_ORIGINS
        value: ""   # Fill in your Vercel URL after deploying, e.g. https://dabbabox.vercel.app
      # Twilio (optional — only needed to actually send WhatsApp messages)
      # - key: TWILIO_SID
      #   value: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      # - key: TWILIO_TOKEN
      #   value: your_auth_token
      # - key: TWILIO_FROM
      #   value: whatsapp:+14155238886
    disk:
      name: dabbabox-data
      mountPath: /data
      sizeGB: 1
