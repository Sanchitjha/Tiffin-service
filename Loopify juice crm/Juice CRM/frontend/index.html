<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#4a7c59" />
<title>DabbaBox — Tiffin CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="logo">D</div>
      <div>
        <div class="brand-name">DabbaBox</div>
        <div class="brand-sub">Tiffin Service CRM</div>
      </div>
    </div>
    <nav class="nav scroll" id="nav"></nav>
    <div class="sidebar-foot">
      <button class="btn btn-secondary btn-sm" onclick="UI.openCmdK()" style="justify-content:space-between;width:100%">
        <span style="font-size:12px;color:var(--c-muted)">Quick search</span>
        <span class="row-tight"><span class="kbd">⌘</span><span class="kbd">K</span></span>
      </button>
      <button class="btn btn-ghost btn-sm" onclick="Auth.logout()" style="width:100%;color:var(--c-muted);justify-content:center;margin-top:4px">Sign out</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Menu"></button>
      <div><div class="page-title" id="pageTitle">Dashboard</div></div>
      <div class="search-wrap">
        <span class="ico" id="searchIco"></span>
        <input id="globalSearch" placeholder="Search customers, orders, leads…" oninput="App.search(this.value)"/>
        <span class="search-kbd kbd">/</span>
      </div>
      <button class="icon-btn" onclick="UI.openCmdK()" title="Command palette (⌘K)" id="cmdkBtn"></button>
      <button class="icon-btn" onclick="UI.openNotifications(event)" title="Notifications" id="notifBtn"></button>
      <button class="icon-btn" onclick="UI.toggleTheme()" title="Toggle theme" id="themeBtn"></button>
      <button class="btn btn-primary" onclick="App.quickAdd()" id="quickAddBtn"><span id="qaIco"></span><span>New</span></button>
    </header>
    <div class="content scroll" id="content"></div>
  </div>
</div>
<div id="modalRoot"></div>
<div class="toast-stack" id="toastRoot"></div>
<div id="cmdkRoot"></div>
<div id="popoverRoot"></div>

<!-- Core JS modules — load order matters -->
<script src="/js/icons.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/state.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/router.js"></script>

<!-- Page modules -->
<script src="/js/pages/dashboard.js"></script>
<script src="/js/pages/customers.js"></script>
<script src="/js/pages/orders.js"></script>
<script src="/js/pages/subscriptions.js"></script>
<script src="/js/pages/products.js"></script>
<script src="/js/pages/leads.js"></script>
<script src="/js/pages/partners.js"></script>
<script src="/js/pages/whatsapp.js"></script>
<script src="/js/pages/calendar.js"></script>
<script src="/js/pages/reports.js"></script>
<script src="/js/pages/settings.js"></script>

<script src="/js/app.js"></script>
</body>
</html>
